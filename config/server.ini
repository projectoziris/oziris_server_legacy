; OZI-RIS Server Pack configuration
; Edit this file to change installation behavior.
; Lines starting with ; are comments. Do not add spaces around '='.

[server]

; Default installation path. Never assume another drive.
install_path=C:\OZI-RIS-Server

; HTTP and database ports
apache_port=8000
mysql_port=3306

; MariaDB root password (change before production install)
db_root_pass=

; Application database and account
db_name=my_db
db_user=root
db_pass=

; PHP settings
memory_limit=256M
upload_max_size=128M
timezone=Asia/Kuala_Lumpur

; Backup retention in days
backup_retention=7
